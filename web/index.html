<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mission control</title>
    <script>
      try {
        var q = new URLSearchParams(location.search).get("theme")
        if (q === "light" || q === "dark") localStorage.setItem("mission-control-theme", q)
        if (localStorage.getItem("mission-control-theme") !== "light") document.documentElement.classList.add("dark")
      } catch (e) {
        document.documentElement.classList.add("dark")
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
